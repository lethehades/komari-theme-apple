name: Preview Theme Package

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run package

      - name: Upload theme package
        uses: actions/upload-artifact@v4
        with:
          name: komari-theme-apple-preview
          path: release/*.zip
          retention-days: 90
